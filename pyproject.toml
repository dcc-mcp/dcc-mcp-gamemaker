[build-system]
requires=["hatchling>=1.26"]
build-backend="hatchling.build"

[project]
name="dcc-mcp-gamemaker"
version="0.1.0"
description="Production GameMaker adapter for headless project inspection, resource authoring, and cross-DCC sprite import"
readme="README.md"
requires-python=">=3.9"
license={text="MIT"}
authors=[{name="loonghao",email="hal.long@outlook.com"}]
keywords=["gamemaker","gml","2d","game-engine","dcc","mcp","automation"]
classifiers=[
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies=["dcc-mcp-core>=0.20.36,<1.0.0"]

[project.urls]
Homepage="https://github.com/dcc-mcp/dcc-mcp-gamemaker"
Repository="https://github.com/dcc-mcp/dcc-mcp-gamemaker"
Issues="https://github.com/dcc-mcp/dcc-mcp-gamemaker/issues"

[project.optional-dependencies]
test=["pytest>=8","ruff>=0.8","PyYAML>=6","jsonschema>=4.23"]
dev=["pytest>=8","ruff>=0.8","PyYAML>=6","jsonschema>=4.23","build>=1.2","twine>=6"]

[project.scripts]
dcc-mcp-gamemaker="dcc_mcp_gamemaker.cli:main"

[project.entry-points."dcc_mcp.adapters"]
gamemaker="dcc_mcp_gamemaker:GamemakerMcpServer"
gm="dcc_mcp_gamemaker:GamemakerMcpServer"

[tool.hatch.build.targets.wheel]
packages=["src/dcc_mcp_gamemaker"]
artifacts=["src/dcc_mcp_gamemaker/skills/**"]

[tool.hatch.build.targets.sdist]
exclude=["docs/**/*.png", "docs/**/*.svg", "docs/**/*.webp"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src","."]
markers=["gamemaker: requires a real GameMaker project and the gm-cli toolchain"]

[tool.ruff.lint]
# FA catches PEP 604 unions (`dict | None`) written without
# `from __future__ import annotations`, which raise at runtime on Python 3.9.
select=["E","F","I","B","FA"]

[tool.ruff]
line-length=100
target-version="py39"
